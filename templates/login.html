
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 15px;
        }
        .box {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
        }
        button {
            background: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error { color: #dc2626; }
    </style>
</head>
<body>
<div class="box">
    <h1>Admin Login</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <a href="/">Back to Complaint Form</a>
</div>
</body>
</html>
